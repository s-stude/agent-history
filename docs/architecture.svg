<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="650" viewBox="0 0 1590 650" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="1590" height="650" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8b8b0"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#d6d6cf;stroke-width:2.5}
    .db{fill:#e8f0fb;stroke:#2f74d6;stroke-width:3.5}
    .t{font-size:28px;font-weight:600;fill:#111;text-anchor:middle}
    .s{font-size:23px;fill:#555;text-anchor:middle}
    .h{font-size:23px;fill:#555}
    .ln{stroke:#b8b8b0;stroke-width:2.5;fill:none}
  </style>
  <text x="40" y="62" font-size="32" font-weight="600" fill="#111">Hooks save every turn; the agent searches only when asked</text>

  <text x="40" y="130" class="h">Capture: every turn, automatic</text>
  <rect x="40" y="160" width="340" height="152" rx="16" class="box"/>
  <text x="210" y="211" class="t">Agent session</text>
  <text x="210" y="245" class="s">Claude Code or Codex</text>
  <text x="210" y="279" class="s">a turn finishes</text>

  <rect x="430" y="160" width="340" height="152" rx="16" class="box"/>
  <text x="600" y="211" class="t">Hooks</text>
  <text x="600" y="245" class="s">Stop, async: true</text>
  <text x="600" y="279" class="s">SessionStart, launchd scan</text>

  <rect x="820" y="160" width="340" height="152" rx="16" class="box"/>
  <text x="990" y="211" class="t">Node.js ingest CLI</text>
  <text x="990" y="245" class="s">read new JSONL / .zst lines</text>
  <text x="990" y="279" class="s">redact, trim, upsert</text>

  <rect x="1210" y="160" width="340" height="152" rx="16" class="db"/>
  <text x="1380" y="211" class="t">agent_history</text>
  <text x="1380" y="245" class="s">PostgreSQL in Postgres.app</text>
  <text x="1380" y="279" class="s">full-text + trigram index</text>

  <line x1="380" y1="236" x2="428" y2="236" class="ln" marker-end="url(#a)"/>
  <line x1="770" y1="236" x2="818" y2="236" class="ln" marker-end="url(#a)"/>
  <line x1="1160" y1="236" x2="1208" y2="236" class="ln" marker-end="url(#a)"/>

  <text x="40" y="420" class="h">Recall: only when you ask</text>
  <rect x="40" y="448" width="340" height="152" rx="16" class="box"/>
  <text x="210" y="499" class="t">You ask</text>
  <text x="210" y="533" class="s">remember last month…</text>
  <text x="210" y="567" class="s">or: run a retro</text>

  <rect x="430" y="448" width="340" height="152" rx="16" class="box"/>
  <text x="600" y="499" class="t">Doc-tree pointer</text>
  <text x="600" y="533" class="s">CLAUDE.md / AGENTS.md</text>
  <text x="600" y="567" class="s">names DB, role + tables</text>

  <rect x="820" y="448" width="340" height="152" rx="16" class="box"/>
  <text x="990" y="499" class="t">Agentic search</text>
  <text x="990" y="533" class="s">psql as read-only role</text>
  <text x="990" y="567" class="s">rg over md exports</text>

  <rect x="1210" y="448" width="340" height="152" rx="16" class="box"/>
  <text x="1380" y="499" class="t">Answer or retro</text>
  <text x="1380" y="533" class="s">dated, linked to</text>
  <text x="1380" y="567" class="s">source sessions</text>

  <line x1="380" y1="524" x2="428" y2="524" class="ln" marker-end="url(#a)"/>
  <line x1="770" y1="524" x2="818" y2="524" class="ln" marker-end="url(#a)"/>
  <line x1="1160" y1="524" x2="1208" y2="524" class="ln" marker-end="url(#a)"/>

  <path d="M990,448 V380 H1380 V316" class="ln" marker-end="url(#a)"/>
  <text x="1185" y="366" class="s">queries</text>
</svg>
