[project]
name = "agent-history"
version = "0.1.0"
description = "Permanent searchable store of Claude Code and Codex sessions"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
agent-history = "agent_history.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]
